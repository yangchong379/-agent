services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career_agent
      POSTGRES_USER: career_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_agent -d career_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career_agent:${POSTGRES_PASSWORD}@postgres:5432/career_agent
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:

